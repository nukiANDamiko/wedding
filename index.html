<!doctype html>
<html lang="ka">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ნუკა & ამიკო · 01.10.2026</title>
    <meta
      name="description"
      content="ნუკა და ამიკო ქორწინდებიან 2026 წლის 1 ოქტომბერს. ჯვრისწერა 13:00, სადღესასწაულო ვახშამი 18:00."
    />
    <meta name="theme-color" content="#Faf0c8" />

    <!-- TODO: og:url / og:image სრული მისამართით შეავსეთ GitHub Pages-ზე ატვირთვის შემდეგ -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ნუკა & ამიკო · 01.10.2026" />
    <meta property="og:description" content="1 ოქტომბერს გელოდებით." />
    <meta
      property="og:image"
      content="assets/images/641E2CCE-9565-4FB1-BDDA-97DA5314FAFB.jpeg"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&amp;family=Noto+Sans+Georgian:wght@300;400;500&amp;family=Noto+Serif+Georgian:wght@200;300;400;500&amp;display=swap"
    />

    <link
      rel="preload"
      as="image"
      href="assets/images/641E2CCE-9565-4FB1-BDDA-97DA5314FAFB.jpeg"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="style.css" />
    <noscript>
      <style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
        .music-toggle {
          display: none;
        }
      </style>
    </noscript>
  </head>

  <body>
    <!-- film grain overlay -->
    <div class="grain" aria-hidden="true"></div>

    <!-- ===== MUSIC ===== -->
    <button
      type="button"
      class="music-toggle"
      id="musicToggle"
      aria-pressed="false"
      aria-label="ფონური მუსიკის ჩართვა"
    >
      <span class="music-toggle__note" aria-hidden="true">♫</span>
      <span class="music-toggle__label" id="musicLabel">მუსიკის ჩართვა</span>
    </button>
    <audio id="music" src="assets/audio/La%20Vie%20En%20Rose.mp3" loop preload="auto"></audio>

    <main>
      <!-- ===== 1 · HERO ===== -->
      <section class="hero" id="hero" aria-labelledby="heroNames">
        <img
          class="hero__image"
          src="assets/images/641E2CCE-9565-4FB1-BDDA-97DA5314FAFB.jpeg"
          width="1002"
          height="1355"
          decoding="async"
          fetchpriority="high"
          alt="ნუკა იცინის, ამიკო მას ეხვევა ხიდზე"
        />
        <div class="hero__veil" aria-hidden="true"></div>

        <div class="hero__content">
          <h1 class="hero__names" id="heroNames">
            ნუკა<span class="amp">&amp;</span>ამიკო
          </h1>
          <p class="hero__date">01 · 10 · 2026</p>
        </div>

        <a class="hero__scroll" href="#stage">
          <span class="hero__scroll-word">ქვემოთ</span>
          <span class="hero__scroll-line" aria-hidden="true"></span>
        </a>
      </section>

      <!-- ===== 2 · VIDEO STAGE =====
           One sticky video layer. Everything in .stage__content scrolls
           over it, so the clip stays put for several screens instead of
           being repeated per section. -->
      <div class="stage" id="stage">
        <div class="stage__media" aria-hidden="true">
          <video
            id="stageVideo"
            class="stage__video"
            width="720"
            height="1280"
            muted
            loop
            playsinline
            preload="metadata"
          >
            <source
              src="assets/video/copy_759FCA88-0E1C-4B51-AD3D-08CBCCB7B18E.MOV"
              type="video/mp4"
            />
          </video>
          <div class="stage__veil"></div>
        </div>

        <div class="stage__fade stage__fade--top" aria-hidden="true"></div>
        <div class="stage__fade stage__fade--bottom" aria-hidden="true"></div>

        <div class="stage__content">
          <!-- a few warm words -->
          <section class="say" aria-label="მოსაწვევი">
            <p class="say__line reveal">ჩვენი დღე ახლოვდება</p>
          </section>

          <!-- day schedule — times, names and map links are kept as they are -->
          <section class="schedule" id="schedule" aria-label="დღის განრიგი">
            <article class="event reveal">
              <p class="event__time">13:00</p>
              <h2 class="event__name">ჯვრისწერა</h2>
              <a
                class="link-arrow"
                href="https://maps.app.goo.gl/bXd352Cbw1iREu7XA"
                target="_blank"
                rel="noopener noreferrer"
              >
                ლოკაციის ნახვა
                <span class="link-arrow__mark" aria-hidden="true">↗</span>
              </a>
            </article>

            <div class="schedule__divider" role="presentation"></div>

            <article class="event reveal">
              <p class="event__time">18:00</p>
              <h2 class="event__name">სადღესასწაულო ვახშამი</h2>
              <a
                class="link-arrow"
                href="https://maps.app.goo.gl/E4BZeAKr4VoQZ91y6"
                target="_blank"
                rel="noopener noreferrer"
              >
                ლოკაციის ნახვა
                <span class="link-arrow__mark" aria-hidden="true">↗</span>
              </a>
            </article>
          </section>

          <!-- countdown -->
          <section class="countdown" aria-labelledby="countdownTitle">
            <h2 class="countdown__title reveal" id="countdownTitle">
              1 ოქტომბრამდე
            </h2>

            <div
              class="countdown__grid reveal"
              id="countdown"
              role="timer"
              data-target="2026-10-01T13:00:00+04:00"
            >
              <div class="unit">
                <span class="unit__value" data-countdown="days">—</span>
                <span class="unit__label">დღე</span>
              </div>
              <div class="unit">
                <span class="unit__value" data-countdown="hours">—</span>
                <span class="unit__label">საათი</span>
              </div>
              <div class="unit">
                <span class="unit__value" data-countdown="minutes">—</span>
                <span class="unit__label">წუთი</span>
              </div>
            </div>

            <p
              class="countdown__message"
              id="countdownMessage"
              aria-live="polite"
              hidden
            ></p>
          </section>
        </div>
      </div>

      <!-- ===== 3 · PHOTO COLLAGE ===== -->
      <section class="collage" aria-label="ფოტოები">
        <p class="collage__intro reveal">რამდენიმე ჩვენი კადრი</p>

        <div class="collage__spread">
          <figure class="shot shot--1 reveal">
            <img
              src="assets/images/BDD3E6F4-6E0E-43E0-8A40-9354BD238BE3.jpeg"
              width="1536"
              height="2048"
              loading="lazy"
              decoding="async"
              alt="ნუკა და ამიკო აყვავებულ ვარდისფერ ხესთან"
            />
          </figure>

          <figure class="shot shot--2 reveal">
            <img
              src="assets/images/F9F5A16A-D714-4277-9F82-09813D09D864.jpeg"
              width="1170"
              height="2080"
              loading="lazy"
              decoding="async"
              alt="ნუკა და ამიკო ერთმანეთს კოცნიან ზაფხულის ქუჩაში"
            />
          </figure>

          <figure class="shot shot--3 reveal">
            <img
              src="assets/images/09E5BF24-B7B2-42EF-84C0-993FEB5A593D.jpeg"
              width="1536"
              height="2048"
              loading="lazy"
              decoding="async"
              alt="ნუკა და ამიკო მზის ჩასვლისას ქუჩაში"
            />
          </figure>

          <figure class="shot shot--4 reveal">
            <img
              src="assets/images/F9532B3D-45B8-4057-A2E9-954DFB0CA17C.jpeg"
              width="1536"
              height="2048"
              loading="lazy"
              decoding="async"
              alt="ნუკა იცინის, ამიკო მას ხიდზე ეხვევა"
            />
          </figure>

          <figure class="shot shot--5 reveal">
            <img
              src="assets/images/02B46C14-C29D-4B82-BC98-36000774B386.jpeg"
              width="1536"
              height="2048"
              loading="lazy"
              decoding="async"
              alt="ნუკა ამიკოს ზურგზე ეკიდება თოვლში"
            />
          </figure>

          <figure class="shot shot--6 reveal">
            <img
              src="assets/images/CB021DD9-540E-43C5-B214-A024DD4FE276.jpeg"
              width="1536"
              height="2048"
              loading="lazy"
              decoding="async"
              alt="ნუკა და ამიკო სარკეში იღებენ ფოტოს"
            />
          </figure>

          <figure class="shot shot--7 reveal">
            <img
              src="assets/images/1B780FD3-8FD4-499B-802C-19D8A3995E23.jpeg"
              width="1536"
              height="2048"
              loading="lazy"
              decoding="async"
              alt="ნუკა და ამიკო ერთმანეთს ეხვევიან თოვლიან მთაში"
            />
          </figure>
        </div>
      </section>
    </main>

    <!-- ===== 4 · ENDING ===== -->
    <footer class="ending">
      <p class="ending__word reveal">გელოდებით</p>
      <p class="ending__names reveal">ნუკა<span class="amp">&amp;</span>ამიკო</p>
      <p class="ending__date reveal">01 · 10 · 2026</p>
      <p class="ending__heart reveal" aria-hidden="true">♡</p>
    </footer>

    <script src="script.js" defer></script>
  </body>
</html>
